<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- Cyberpunk Gradient -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ff2bd6" />
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Chamfered HUD Background -->
  <path d="M 10,10 L 95,10 L 110,25 L 110,110 L 25,110 L 10,95 Z" fill="#0a0a12" stroke="#ff2bd6" stroke-width="2" />

  <!-- Tech/Glitch Accents -->
  <rect x="5" y="40" width="5" height="15" fill="#fcee09" />
  <rect x="110" y="65" width="5" height="15" fill="#00f0ff" />

  <!-- Glowing N -->
  <path d="M 35,85 L 35,35 L 85,85 L 85,35" fill="none" stroke="url(#neon-grad)" stroke-width="14" filter="url(#glow)" stroke-linejoin="miter" stroke-linecap="square" />
</svg>
